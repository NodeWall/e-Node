<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eNode Dashboard</title>
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/themes.css" />
</head>
<body>
  <div id="app">
    <!-- ROW 1 (1fr) -->
    <section class="tile" data-slot="A"><div id="clock-widget" class="slot"></div></section>
    <section class="tile" data-slot="B"><div id="maps-widget" class="slot" onclick="window.location.href='/widgets/maps/maps.html'"></div></section>
    <section class="tile" data-slot="C"><div id="network-widget" class="slot"></div></section>

    <!-- ROW 2 (1fr) -->
    <section class="tile" data-slot="D"><div id="proxmox-widget" class="slot"></div></section>
    <section class="tile" data-slot="E"><div id="cameras-widget" class="slot"></div></section>
    <section class="tile" data-slot="F"><div id="homeassistant-widget" class="slot"></div></section>

    <!-- ROW 3 (0.5fr) - Reserved slots (empty frames for geometry test) -->
    <section class="tile" data-slot="G"><div class="slot empty-slot"><span style="opacity:0.3;font-size:1rem;">Slot G</span></div></section>
    <section class="tile" data-slot="H"><div class="slot empty-slot"><span style="opacity:0.3;font-size:1rem;">Slot H</span></div></section>
    <section class="tile" data-slot="I"><div class="slot empty-slot"><span style="opacity:0.3;font-size:1rem;">Slot I</span></div></section>
  </div>

  <script type="module">
    import { clockWidget } from '/widgets/clock/clock.js';
    import { networkWidget } from '/widgets/network/network.js';
    import { mapsWidget } from '/widgets/maps/maps.js';
    import { proxmoxWidget } from '/widgets/proxmox/proxmox.js';
    import { camerasWidget } from '/widgets/cameras/cameras.js';
    import { homeassistantWidget } from '/widgets/homeassistant/homeassistant.js';

    clockWidget.init();
    networkWidget.init();
    mapsWidget.init();
    proxmoxWidget.init();
    camerasWidget.init();
    homeassistantWidget.init();
  </script>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eNode Dashboard</title>
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/themes.css" />
</head>
<body>
  <div id="app">
    <!-- ROW 1 (1fr) -->
    <section class="tile" data-slot="R1C1"><div id="clock-widget" class="slot"></div></section>
    <section class="tile" data-slot="R1C2"><div id="maps-widget" class="slot" onclick="window.location.href='/widgets/maps/maps.html'"></div></section>
    <section class="tile" data-slot="R1C3"><div id="network-widget" class="slot"></div></section>

    <!-- ROW 2 (1fr) -->
    <section class="tile" data-slot="R2C1"><div id="proxmox-widget" class="slot"></div></section>
    <section class="tile" data-slot="R2C2"><div id="cameras-widget" class="slot"></div></section>
    <section class="tile" data-slot="R2C3"><div id="homeassistant-widget" class="slot"></div></section>
  </div>

  <script type="module">
    import { clockWidget } from '/widgets/clock/clock.js';
    import { networkWidget } from '/widgets/network/network.js';
    import { mapsWidget } from '/widgets/maps/maps.js';
    import { proxmoxWidget } from '/widgets/proxmox/proxmox.js';
    import { camerasWidget } from '/widgets/cameras/cameras.js';
    import { homeassistantWidget } from '/widgets/homeassistant/homeassistant.js';

    clockWidget.init();
    networkWidget.init();
    mapsWidget.init();
    proxmoxWidget.init();
    camerasWidget.init();
    homeassistantWidget.init();
  </script>
</body>
</html>

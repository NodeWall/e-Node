<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eNode Dashboard</title>
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/themes.css" />
</head>
<body>
  <div id="screen">
    <div id="app">
      <!-- ROW 1 (1fr) -->
      <section class="tile" data-slot="R1C1"><div id="clock-widget" class="slot"></div></section>
      <section class="tile" data-slot="R1C2"><div id="maps-widget" class="slot" onclick="sendSpoke('/widgets/maps/maps.html')"></div></section>
      <section class="tile" data-slot="R1C3">
        <div class="mc-split-row">
          <div id="network-widget" class="slot"></div>
          <div class="launcher-block slot">
            <div class="launcher-tile" onclick="sendSpoke('http://10.10.10.100:8123/')">Home Assistant</div>
            <div class="launcher-tile" onclick="sendHermesSpoke()">Hermes WebUI</div>
            <div class="launcher-tile" onclick="sendSpoke('http://10.10.10.121:8090/')">TorrServ</div>
            <div class="launcher-tile" onclick="sendSpoke('http://10.10.10.123:9117/')">Jackett</div>
          </div>
        </div>
      </section>

      <!-- ROW 2 (1fr) -->
      <section class="tile" data-slot="R2C1">
        <div class="mc-split-col">
          <div class="slot" style="overflow:hidden;"><iframe src="https://www.meteoblue.com/uk/weather/widget/daily/kyiv_ukraine_703448?days=3&layout=dark&maxtemperature=1&mintemperature=1&pictoicon=1&precipitation=1&precipitationprobability=1&spot=1&uv=1&v=2&winddirection=1&windgust=1&windspeed=1" style="width:100%;height:100%;border:0;display:block;" scrolling="no"></iframe></div>
          <div class="slot" style="overflow:hidden;"><iframe src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&ctz=Europe%2FKyiv&hl=uk&wkst=2&showTitle=0&showNav=0&showPrint=0&showTabs=0&showCalendars=0&mode=MONTH" style="width:100%;height:100%;border:0;display:block;" scrolling="no"></iframe></div>
        </div>
      </section>
      <section class="tile" data-slot="R2C2"><div id="cameras-widget" class="slot"></div></section>
      <section class="tile" data-slot="R2C3">
        <div class="mc-split-col">
          <div id="proxmox-widget" class="slot"></div>
          <div class="slot pbs-placeholder">Proxmox Backup Server<br>Not configured</div>
        </div>
      </section>
    </div>

    <div id="control-strip">Control Strip</div>
  </div>

  <script>
    window.sendSpoke = function (url) {
      return fetch('/api/cp/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd: 'spoke', url }),
      }).catch(() => {});
    };

    window.sendHermesSpoke = async function() {
      try {
        const res = await fetch('/api/system/proxmox-status');
        const data = await res.json();
        const ip = data.ip || '127.0.0.1';
        sendSpoke(`https://${ip}:8787/`);
      } catch (e) {
        console.error('Failed to resolve Hermes IP:', e);
      }
    };
  </script>
  <script type="module">
    import { clockWidget } from '/widgets/clock/clock.js';
    import { networkWidget } from '/widgets/network/network.js';
    import { mapsWidget } from '/widgets/maps/maps.js';
    import { proxmoxWidget } from '/widgets/proxmox/proxmox.js';
    import { camerasWidget } from '/widgets/cameras/cameras.js';

    clockWidget.init();
    networkWidget.init();
    mapsWidget.init();
    proxmoxWidget.init();
    camerasWidget.init();
  </script>
</body>
</html>
